<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ton Wiiin</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        body { 
            font-family: sans-serif; 
            background-color: #101010; 
            color: white; 
            text-align: center; 
            padding: 20px; 
        }
        .card { 
            background: #1e1e1e; 
            border-radius: 15px; 
            padding: 20px; 
            margin: 20px auto; 
            max-width: 400px;
            border: 1px solid #333;
        }
        .btn { 
            background: #0098EA; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 10px; 
            font-size: 18px; 
            cursor: pointer; 
            width: 100%;
            margin-top: 10px;
        }
        #status { 
            margin-top: 15px; 
            font-size: 14px; 
            color: #aaa; 
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>💰 رصيدك: <span id="balance">0</span></h1>
    </div>

    <div class="card">
        <h3>شاهد واربح</h3>
        <button class="btn" onclick="showAd()">📺 مشاهدة إعلان (+100)</button>
        <p id="status"></p>
    </div>

    <script>
        // إعدادات البوت
        const BLOCK_ID = "18732"; 
        const tg = window.Telegram.WebApp;
        tg.expand();

        // 1. دالة البداية
        async function init() {
            try {
                const user = tg.initDataUnsafe.user || {id: 0};
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        id: user.id,
                        name: user.first_name,
                        username: user.username,
                        start_param: tg.initDataUnsafe.start_param
                    })
                });
                const data = await res.json();
                document.getElementById('balance').innerText = data.balance;
            } catch (e) {
                console.error(e);
            }
        }

        // 2. دالة عرض الإعلان (بالطريقة الجديدة)
        async function showAd() {
            const status = document.getElementById('status');
            const user = tg.initDataUnsafe.user || {id: 0};
            
            status.innerText = "جاري التحميل...";
            
            // التحقق من وجود المكتبة
            if (!window.Adsgram) {
                status.innerText = "خطأ: المكتبة لم تتحمل (تأكد من إيقاف مانع الإعلانات)";
                return;
            }

            // الكود الرسمي من الوثائق
            const AdController = window.Adsgram.init({ blockId: BLOCK_ID });

            AdController.show().then((result) => {
                // المستخدم شاهد الإعلان للنهاية
                fetch('/api/watch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: user.id})
                }).then(r => r.json()).then(d => {
                    document.getElementById('balance').innerText = d.new_balance;
                    status.innerText = "✅ مبروك! تمت إضافة النقاط";
                    status.style.color = "#0f0";
                });
            }).catch((result) => {
                // خطأ أو إغلاق
                status.innerText = "❌ لم تكمل المشاهدة";
                status.style.color = "red";
            });
        }

        // تشغيل
        init();
    </script>
</body>
</html>
