<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ton Reward Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://adsgram.ai/js/adsgram.js?v=1"></script>
    <style>
        :root { --primary: #007aff; --bg: #121212; --card: #1e1e1e; --text: #ffffff; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        /* Glassmorphism Card */
        .card { background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; margin: 15px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        
        .balance-num { font-size: 38px; font-weight: 800; background: linear-gradient(45deg, #007aff, #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: transform 0.1s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:active { transform: scale(0.98); }
        
        /* Navigation */
        .nav { position: fixed; bottom: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; }
        .nav-item { opacity: 0.5; font-size: 12px; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { opacity: 1; color: var(--primary); }
        .icon { font-size: 22px; margin-bottom: 4px; }
        
        /* Pages */
        .page { display: none; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="p-home" class="page active">
        <div class="card">
            <h3 id="txt-balance-title">Current Balance</h3>
            <div class="balance-num" id="balance">0</div>
            <div style="color: #aaa;">COINS</div>
        </div>

        <div class="card">
            <h3 id="txt-earn-title">Earn Coins</h3>
            <p id="txt-earn-desc" style="color:#888;">Watch ads to earn rewards.</p>
            <button class="btn btn-primary" onclick="showAd()">
                📺 <span id="btn-watch">Watch Ad (+100)</span>
            </button>
            <p id="status-msg" style="margin-top:10px; font-size:14px;"></p>
        </div>
    </div>

    <div id="p-wallet" class="page">
        <div class="card">
            <h3 id="txt-withdraw-title">Withdraw Funds</h3>
            <p id="txt-min-withdraw" style="color:#aaa;">Min Withdraw: 50,000 Coins</p>
            <input type="text" id="wallet-input" placeholder="Paste your TON Wallet" style="width: 90%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: white; margin-bottom: 10px;">
            <button class="btn btn-primary" onclick="requestWithdraw()" id="btn-withdraw">Request Payment</button>
        </div>
    </div>

    <div id="p-friends" class="page">
        <div class="card">
            <h3 id="txt-invite-title">Invite Friends</h3>
            <p id="txt-invite-desc">Get 500 Coins for each friend!</p>
            <div style="background:#222; padding:10px; border-radius:8px; word-break:break-all; font-size:12px; color: var(--primary);" id="ref-link">...</div>
            <button class="btn btn-primary" onclick="copyRef()" id="btn-copy">Copy Link</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="nav('p-home', this)">
            <span class="icon">🏠</span> <span id="nav-home">Home</span>
        </div>
        <div class="nav-item" onclick="nav('p-wallet', this)">
            <span class="icon">🏦</span> <span id="nav-wallet">Wallet</span>
        </div>
        <div class="nav-item" onclick="nav('p-friends', this)">
            <span class="icon">👥</span> <span id="nav-friends">Friends</span>
        </div>
    </div>

    <script>
        // --- TRANSLATIONS (قاموس اللغات) ---
        const langData = {
            en: {
                balanceTitle: "Current Balance",
                earnTitle: "Earn Coins",
                earnDesc: "Watch ads to earn rewards.",
                btnWatch: "Watch Ad (+100)",
                withdrawTitle: "Withdraw Funds",
                minWithdraw: "Min Withdraw: 50,000 Coins",
                btnWithdraw: "Request Payment",
                inviteTitle: "Invite Friends",
                inviteDesc: "Get 500 Coins for each friend!",
                btnCopy: "Copy Link",
                navHome: "Home",
                navWallet: "Wallet",
                navFriends: "Friends",
                statusSuccess: "You earned 100 coins! 🎉",
                statusFail: "Ad closed/failed ❌",
                alertSent: "Withdrawal request sent!",
                alertLow: "Not enough balance!",
                alertWallet: "Enter wallet address first!"
            },
            ar: {
                balanceTitle: "رصيدك الحالي",
                earnTitle: "اربح العملات",
                earnDesc: "شاهد الإعلانات لتربح المكافآت.",
                btnWatch: "شاهد إعلان (+100)",
                withdrawTitle: "سحب الأرباح",
                minWithdraw: "الحد الأدنى: 50,000 عملة",
                btnWithdraw: "طلب سحب",
                inviteTitle: "دعوة الأصدقاء",
                inviteDesc: "احصل على 500 عملة لكل صديق!",
                btnCopy: "نسخ الرابط",
                navHome: "الرئيسية",
                navWallet: "المحفظة",
                navFriends: "الأصدقاء",
                statusSuccess: "ربحت 100 عملة! 🎉",
                statusFail: "لم تكمل الإعلان ❌",
                alertSent: "تم إرسال طلب السحب بنجاح!",
                alertLow: "رصيدك غير كافٍ للسحب!",
                alertWallet: "أدخل عنوان المحفظة أولاً!"
            }
        };

        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe.user || {id: 123, first_name: "Test", language_code: "ar"}; // Test Data
        
        // تحديد اللغة
        let currLang = (user.language_code === 'ar') ? 'ar' : 'en';
        if(document.dir) document.dir = (currLang === 'ar') ? 'rtl' : 'ltr';

        function setLanguage(lang) {
            const t = langData[lang];
            document.getElementById('txt-balance-title').innerText = t.balanceTitle;
            document.getElementById('txt-earn-title').innerText = t.earnTitle;
            document.getElementById('txt-earn-desc').innerText = t.earnDesc;
            document.getElementById('btn-watch').innerText = t.btnWatch;
            document.getElementById('txt-withdraw-title').innerText = t.withdrawTitle;
            document.getElementById('txt-min-withdraw').innerText = t.minWithdraw;
            document.getElementById('btn-withdraw').innerText = t.btnWithdraw;
            document.getElementById('txt-invite-title').innerText = t.inviteTitle;
            document.getElementById('txt-invite-desc').innerText = t.inviteDesc;
            document.getElementById('btn-copy').innerText = t.btnCopy;
            document.getElementById('nav-home').innerText = t.navHome;
            document.getElementById('nav-wallet').innerText = t.navWallet;
            document.getElementById('nav-friends').innerText = t.navFriends;
        }
        setLanguage(currLang);

        // --- LOGIC ---
        const api = '/api';
        
        async function init() {
            const res = await fetch(api + '/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    id: user.id,
                    first_name: user.first_name,
                    lang_code: currLang,
                    start_param: tg.initDataUnsafe.start_param
                })
            });
            const data = await res.json();
            document.getElementById('balance').innerText = data.balance;
            if(data.wallet) document.getElementById('wallet-input').value = data.wallet;
            
            // رابط الإحالة
            const botName = "Watch_and_wiiin_bot"; // استبدل باسم بوتك بدقة
            document.getElementById('ref-link').innerText = `https://t.me/${botName}?startapp=${user.id}`;
        }

        function nav(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function showAd() {
            // ضع الكود الخاص بك هنا
            const AdController = window.Adsgram.init({ blockId: "YOUR_ADSGRAM_BLOCK_ID" }); 
            const msg = document.getElementById('status-msg');
            msg.innerText = "...";

            AdController.show().then((result) => {
                fetch(api + '/watch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: user.id})
                }).then(r => r.json()).then(d => {
                    document.getElementById('balance').innerText = d.new_balance;
                    msg.innerText = langData[currLang].statusSuccess;
                    msg.style.color = "#0f0";
                });
            }).catch((result) => {
                msg.innerText = langData[currLang].statusFail;
                msg.style.color = "red";
            });
        }

        async function requestWithdraw() {
            const wallet = document.getElementById('wallet-input').value;
            if(!wallet) return alert(langData[currLang].alertWallet);
            
            const res = await fetch(api + '/withdraw', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: user.id, wallet: wallet})
            });
            const d = await res.json();
            if(d.success) {
                alert(langData[currLang].alertSent);
                document.getElementById('balance').innerText = "0";
            } else {
                alert(langData[currLang].alertLow);
            }
        }
        
        function copyRef() {
            navigator.clipboard.writeText(document.getElementById('ref-link').innerText);
            alert("Copied!");
        }

        init();
    </script>
</body>
  </html>
