<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ton Wiiin</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    
    <style>
        /* التصميم والألوان */
        :root { --primary: #0088cc; --bg: #1c1c1e; --card: #2c2c2e; --text: #ffffff; }
        body { margin: 0; font-family: sans-serif; background-color: var(--bg); color: var(--text); padding-bottom: 80px; user-select: none; }
        .header { padding: 20px; text-align: center; }
        .balance-amount { font-size: 40px; font-weight: bold; color: var(--primary); margin: 10px 0; }
        .card { background-color: var(--card); border-radius: 15px; padding: 20px; margin: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; color: white; }
        .btn-primary { background-color: var(--primary); }
        .nav { position: fixed; bottom: 0; width: 100%; background: #252525; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .page { display: none; }
        .page.active { display: block; }
        input { width: 90%; padding: 12px; background: #1a1a1a; border: 1px solid #444; color: white; border-radius: 8px; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div>رصيدك الحالي</div>
        <div class="balance-amount"><span id="balance">0</span> عملة</div>
    </div>

    <div id="p-home" class="page active">
        <div class="card">
            <h3>شاهد واربح</h3>
            <button class="btn btn-primary" onclick="showAd()">📺 شاهد إعلان (+100)</button>
            <p id="status" style="margin-top:10px; color:#aaa; font-size:12px;"></p>
        </div>
    </div>

    <div id="p-wallet" class="page">
        <div class="card">
            <h3>سحب الأرباح</h3>
            <p>100,000 عملة = 0.5$</p>
            <input type="text" id="wallet-input" placeholder="محفظة TON">
            <button class="btn btn-primary" onclick="withdraw()">طلب سحب</button>
        </div>
    </div>

    <div id="p-friends" class="page">
        <div class="card">
            <h3>دعوة الأصدقاء</h3>
            <input type="text" id="ref-link" readonly value="...">
            <button class="btn btn-primary" onclick="copyRef()">نسخ الرابط</button>
        </div>
    </div>

    <div class="nav">
        <div onclick="nav('p-home')">🏠 الرئيسية</div>
        <div onclick="nav('p-wallet')">💰 المحفظة</div>
        <div onclick="nav('p-friends')">👥 الأصدقاء</div>
    </div>

    <script>
        const BLOCK_ID = "18732"; // معرف الإعلان الخاص بك
        const BOT_USERNAME = "Watchandwiiinbot"; 

        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user || {id: 0, first_name: "Guest"};

        async function init() {
            // جلب البيانات من السيرفر
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    id: user.id,
                    name: user.first_name,
                    username: user.username,
                    start_param: tg.initDataUnsafe.start_param
                })
            });
            const data = await res.json();
            document.getElementById('balance').innerText = data.balance;
            if(data.wallet) document.getElementById('wallet-input').value = data.wallet;
            document.getElementById('ref-link').value = `https://t.me/${BOT_USERNAME}?startapp=${user.id}`;
        }

        [span_1](start_span)[span_2](start_span)[span_3](start_span)// دالة عرض الإعلان الرسمية[span_1](end_span)[span_2](end_span)[span_3](end_span)
        function showAd() {
            const status = document.getElementById('status');
            status.innerText = "جاري التحميل...";
            
            // التحقق من تحميل المكتبة
            if(!window.Adsgram) {
                status.innerText = "خطأ: المكتبة لم تحمل";
                return;
            }

            [span_4](start_span)// تهيئة الإعلان[span_4](end_span)
            const AdController = window.Adsgram.init({ blockId: BLOCK_ID });

            [span_5](start_span)[span_6](start_span)// عرض الإعلان والتعامل مع النتيجة[span_5](end_span)[span_6](end_span)
            AdController.show().then((result) => {
                // المستخدم شاهد الإعلان للنهاية
                fetch('/api/watch', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: user.id})
                }).then(r => r.json()).then(d => {
                    document.getElementById('balance').innerText = d.new_balance;
                    status.innerText = "✅ مبروك! +100 نقطة";
                    status.style.color = "lightgreen";
                });
            }).catch((result) => {
                [span_7](start_span)// المستخدم أغلق الإعلان أو حدث خطأ[span_7](end_span)
                console.log(result);
                status.innerText = "❌ لم تكمل المشاهدة";
                status.style.color = "red";
            });
        }

        function withdraw() {
            const wallet = document.getElementById('wallet-input').value;
            fetch('/api/withdraw', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: user.id, wallet: wallet})
            }).then(r => r.json()).then(d => {
                if(d.success) alert("تم الطلب!");
                else alert("رصيد غير كاف");
            });
        }

        function copyRef() {
            const el = document.getElementById('ref-link');
            el.select();
            navigator.clipboard.writeText(el.value);
            alert("تم النسخ");
        }

        function nav(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        init();
    </script>
</body>
</html>
